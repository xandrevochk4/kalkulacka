<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model-67 Scientific Precision Computer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

        :root {
            --chassis-bg: #18191b;
            --bezel-bg: #222428;
            --display-bg: #101113;
            --screen-text: #d8ded6;
            --btn-num-bg: #2a2d32;
            --btn-num-text: #e1e4e8;
            --btn-func-bg: #353a40;
            --btn-func-text: #b0b8c0;
            --btn-accent-bg: #d9531e;
            --btn-accent-text: #ffffff;
            --btn-mem-bg: #233238;
            --btn-mem-text: #7ba8b6;
            --border-metal: #383d44;
            --font-stack: 'IBM Plex Mono', 'Courier Prime', monospace;
        }

        body {
            background-color: #0f1012;
            color: #d1d5db;
            font-family: var(--font-stack);
            user-select: none;
            -webkit-user-select: none;
            background-image: radial-gradient(#22252a 1px, transparent 0);
            background-size: 16px 16px;
        }

        /* Tactile Key Press Behavior */
        .btn-tactile {
            box-shadow: 0 3px 0 0 #0d0e0f, inset 0 1px 0 0 rgba(255,255,255,0.08);
            transition: transform 0.03s ease, box-shadow 0.03s ease, background-color 0.1s ease;
        }

        .btn-tactile:active, .btn-pressed {
            transform: translateY(2px);
            box-shadow: 0 1px 0 0 #0d0e0f, inset 0 1px 0 0 rgba(0,0,0,0.3);
        }

        .led-indicator {
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8), 0 0 4px currentColor;
        }

        /* Paper Tape Custom Styling */
        .paper-tape {
            background-color: #141517;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 0);
            background-size: 100% 20px;
        }

        /* CRT / Scanline Diagnostic Effect */
        .crt-overlay {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.3) 50%
            );
            background-size: 100% 4px;
        }

        /* Custom Scrollbar for Ledger */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #141517;
        }
        ::-webkit-scrollbar-thumb {
            background: #383d44;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b525d;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-2 sm:p-6 overflow-x-hidden">

    <main class="w-full max-w-5xl my-auto">
        
        <!-- Header Spec Plate -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end border-b border-[#383d44] pb-2 mb-3 px-1 text-xs text-neutral-400 font-mono tracking-wider gap-2">
            <div class="flex items-center gap-3">
                <span class="font-bold text-neutral-200 tracking-widest">LABORATORY COMPUTER</span>
                <span class="text-[10px] bg-[#222428] border border-[#383d44] px-1.5 py-0.5 text-neutral-400">SER. 67-0091A</span>
            </div>
            <div class="flex items-center gap-4 text-[11px]">
                <a href="index.html" class="text-amber-400 hover:text-amber-300 font-bold border border-amber-500/30 px-2 py-0.5 bg-[#222428] transition-colors">← BACK TO DICE</a>
                <span class="hidden sm:inline text-neutral-500">RESONANCE: 670Hz</span>
            </div>
        </div>

        <!-- Main Assembly (Asymmetric Two-Column Layout) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

            <!-- Left Panel: Physical Calculator Console (8 cols) -->
            <div class="lg:col-span-8 bg-[#18191b] border-2 border-[#383d44] p-4 sm:p-6 shadow-2xl relative">
                
                <!-- Top Status Strip & Physical Mode Toggle Switches -->
                <div class="flex flex-wrap justify-between items-center bg-[#101113] border border-[#2c3036] p-2.5 mb-4 text-xs font-mono">
                    <div class="flex items-center gap-4">
                        <!-- Mode Switch: DEG / RAD -->
                        <div class="flex items-center gap-2">
                            <span class="text-neutral-500 text-[10px] uppercase font-bold">ANGLE</span>
                            <div class="inline-flex border border-[#383d44] bg-[#18191b] p-0.5">
                                <button id="btn-deg" class="px-2 py-0.5 text-[11px] font-bold bg-[#d9531e] text-white">DEG</button>
                                <button id="btn-rad" class="px-2 py-0.5 text-[11px] font-bold text-neutral-400 hover:text-white">RAD</button>
                            </div>
                        </div>

                        <!-- 2nd Function Toggle -->
                        <div class="flex items-center gap-2">
                            <button id="btn-2nd" class="px-2.5 py-1 text-[11px] font-bold border border-[#383d44] bg-[#2a2d32] text-neutral-300 hover:bg-[#353a40]">
                                <span id="led-2nd" class="inline-block w-1.5 h-1.5 rounded-full bg-neutral-600 mr-1.5"></span>2nd
                            </button>
                        </div>
                    </div>

                    <!-- Status Display Indicator -->
                    <div class="flex items-center gap-3 mt-2 sm:mt-0 text-[11px]">
                        <span id="mem-indicator" class="text-neutral-600 font-bold">MEM: EMPTY</span>
                        <span id="status-tag" class="text-neutral-400 border border-[#2a2d32] px-1.5 py-0.5">READY</span>
                    </div>
                </div>

                <!-- Primary CRT Display Screen -->
                <div class="bg-[#101113] border-2 border-[#2c3036] p-4 mb-5 text-right font-mono flex flex-col justify-between min-h-[110px] relative shadow-inner">
                    <!-- Upper Calculation Ledger Line -->
                    <div id="formula-display" class="text-xs sm:text-sm text-neutral-500 overflow-x-auto whitespace-nowrap min-h-[22px] mb-1 tracking-wide">
                        &nbsp;
                    </div>

                    <!-- Main Numeric Output Line -->
                    <div class="flex items-baseline justify-end overflow-hidden">
                        <span id="easter-indicator" class="hidden text-[#d9531e] text-xs font-bold mr-auto self-center border border-[#d9531e]/50 px-1.5 py-0.5">
                            PROTOCOL 67
                        </span>
                        <span id="main-display" class="text-3xl sm:text-4xl font-bold text-[#d8ded6] tracking-tight overflow-x-auto whitespace-nowrap">
                            0
                        </span>
                    </div>
                </div>

                <!-- Keypad Grid Assembly -->
                <div class="space-y-2.5">
                    
                    <!-- Row 1: Memory Controls & Clearing -->
                    <div class="grid grid-cols-6 gap-1.5 sm:gap-2">
                        <button data-action="mc" class="btn-tactile bg-[#233238] text-[#7ba8b6] font-bold py-2 sm:py-2.5 text-xs sm:text-sm">MC</button>
                        <button data-action="mr" class="btn-tactile bg-[#233238] text-[#7ba8b6] font-bold py-2 sm:py-2.5 text-xs sm:text-sm">MR</button>
                        <button data-action="m-plus" class="btn-tactile bg-[#233238] text-[#7ba8b6] font-bold py-2 sm:py-2.5 text-xs sm:text-sm">M+</button>
                        <button data-action="m-minus" class="btn-tactile bg-[#233238] text-[#7ba8b6] font-bold py-2 sm:py-2.5 text-xs sm:text-sm">M-</button>
                        <button data-action="clear-entry" class="btn-tactile bg-[#353a40] text-amber-400 font-bold py-2 sm:py-2.5 text-xs sm:text-sm">CE</button>
                        <button data-action="clear-all" class="btn-tactile bg-[#353a40] text-rose-400 font-bold py-2 sm:py-2.5 text-xs sm:text-sm">AC</button>
                    </div>

                    <!-- Row 2: Advanced Scientific Functions 1 -->
                    <div class="grid grid-cols-6 gap-1.5 sm:gap-2">
                        <button data-func="sin" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">
                            <span class="func-primary">sin</span>
                        </button>
                        <button data-func="cos" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">
                            <span class="func-primary">cos</span>
                        </button>
                        <button data-func="tan" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">
                            <span class="func-primary">tan</span>
                        </button>
                        <button data-func="ln" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">
                            <span class="func-primary">ln</span>
                        </button>
                        <button data-func="log10" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">
                            <span class="func-primary">log</span>
                        </button>
                        <button data-action="delete" class="btn-tactile bg-[#353a40] text-neutral-200 font-bold py-2.5 text-xs sm:text-sm">DEL</button>
                    </div>

                    <!-- Row 3: Advanced Scientific Functions 2 -->
                    <div class="grid grid-cols-6 gap-1.5 sm:gap-2">
                        <button data-func="sqr" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">
                            <span class="func-primary">x²</span>
                        </button>
                        <button data-operator="pow" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">
                            <span class="func-primary">x^y</span>
                        </button>
                        <button data-func="sqrt" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">
                            <span class="func-primary">√x</span>
                        </button>
                        <button data-func="cbrt" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">
                            <span class="func-primary">∛x</span>
                        </button>
                        <button data-func="fact" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">n!</button>
                        <button data-operator="mod" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">MOD</button>
                    </div>

                    <!-- Row 4: Keypad Digits & Arithmetic 1 -->
                    <div class="grid grid-cols-6 gap-1.5 sm:gap-2">
                        <button data-const="pi" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">π</button>
                        <button data-const="e" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">e</button>
                        <button data-number="7" class="btn-tactile bg-[#2a2d32] text-[#e1e4e8] font-bold py-3 text-base">7</button>
                        <button data-number="8" class="btn-tactile bg-[#2a2d32] text-[#e1e4e8] font-bold py-3 text-base">8</button>
                        <button data-number="9" class="btn-tactile bg-[#2a2d32] text-[#e1e4e8] font-bold py-3 text-base">9</button>
                        <button data-operator="/" class="btn-tactile bg-[#d9531e] text-white font-bold py-3 text-base">÷</button>
                    </div>

                    <!-- Row 5: Keypad Digits & Arithmetic 2 -->
                    <div class="grid grid-cols-6 gap-1.5 sm:gap-2">
                        <button data-action="paren-open" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">(</button>
                        <button data-action="paren-close" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">)</button>
                        <button data-number="4" class="btn-tactile bg-[#2a2d32] text-[#e1e4e8] font-bold py-3 text-base">4</button>
                        <button data-number="5" class="btn-tactile bg-[#2a2d32] text-[#e1e4e8] font-bold py-3 text-base">5</button>
                        <button data-number="6" class="btn-tactile bg-[#2a2d32] text-[#e1e4e8] font-bold py-3 text-base">6</button>
                        <button data-operator="*" class="btn-tactile bg-[#d9531e] text-white font-bold py-3 text-base">×</button>
                    </div>

                    <!-- Row 6: Keypad Digits & Arithmetic 3 -->
                    <div class="grid grid-cols-6 gap-1.5 sm:gap-2">
                        <button data-func="abs" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">|x|</button>
                        <button data-func="inv" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-2.5 text-xs sm:text-sm">1/x</button>
                        <button data-number="1" class="btn-tactile bg-[#2a2d32] text-[#e1e4e8] font-bold py-3 text-base">1</button>
                        <button data-number="2" class="btn-tactile bg-[#2a2d32] text-[#e1e4e8] font-bold py-3 text-base">2</button>
                        <button data-number="3" class="btn-tactile bg-[#2a2d32] text-[#e1e4e8] font-bold py-3 text-base">3</button>
                        <button data-operator="-" class="btn-tactile bg-[#d9531e] text-white font-bold py-3 text-base">−</button>
                    </div>

                    <!-- Row 7: Bottom Action Row -->
                    <div class="grid grid-cols-6 gap-1.5 sm:gap-2">
                        <button data-action="toggle-sign" class="btn-tactile bg-[#353a40] text-[#b0b8c0] font-bold py-3 text-sm">±</button>
                        <button data-number="0" class="btn-tactile bg-[#2a2d32] text-[#e1e4e8] font-bold py-3 text-base">0</button>
                        <button data-action="decimal" class="btn-tactile bg-[#2a2d32] text-[#e1e4e8] font-bold py-3 text-base">.</button>
                        <button data-operator="+"
