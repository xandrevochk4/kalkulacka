        :root {

        body {

        .btn-tactile {

            transition: transform 0.03s ease, box-shadow 0.03s ease, background-color 0.1s ease;

            background-color: #141517;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 0);
            background-size: 100% 20px;
        }

        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);

        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

            background: #141517;
        }
        ::-webkit-scrollbar-thumb {
            background: #383d44;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b525d;
        }
    </style>

    <script>
        class ScientificCalculator {
            constructor() {
                this.mainDisplay = document.getElementById('main-display');
                this.formulaDisplay = document.getElementById('formula-display');
                this.paperTape = document.getElementById('paper-tape');
                this.entryCountEl = document.getElementById('entry-count');
                this.memIndicator = document.getElementById('mem-indicator');

                this.resetAll();
            }

            resetAll() {
                this.currentInput = '0';
                this.previousOperand = null;
                this.operator = null;
                this.waitingForNextOperand = false;
                this.expressionHistory = '';
                this.memory = 0;
                this.isRad = false;
                this.entryCount = 0;
                
                this.updateDisplay();
                this.updateMemoryIndicator();
            }

            inputDigit(digit) {
                if (this.waitingForNextOperand) {
                    this.currentInput = digit;
                    this.waitingForNextOperand = false;
                } else {
                    this.currentInput = this.currentInput === '0' ? digit : this.currentInput + digit;
                }
                this.updateDisplay();
            }

            inputDecimal() {
                if (this.waitingForNextOperand) {
                    this.currentInput = '0.';
                    this.waitingForNextOperand = false;
                } else if (!this.currentInput.includes('.')) {
                    this.currentInput += '.';
                }
                this.updateDisplay();
            }

            inputConstant(type) {
                let val = (type === 'pi') ? Math.PI : Math.E;
                this.currentInput = String(this.formatResult(val));
                this.waitingForNextOperand = false;
                this.updateDisplay();
            }

            handleOperator(op) {
                const val = parseFloat(this.currentInput);

                if (this.previousOperand === null) {
                    this.previousOperand = val;
                } else if (this.operator && !this.waitingForNextOperand) {
                    const res = this.calculate(this.previousOperand, val, this.operator);
                    this.currentInput = String(this.formatResult(res));
                    this.previousOperand = res;
                } else {
                    this.previousOperand = val;
                }

                this.waitingForNextOperand = true;
                this.operator = op;
                this.expressionHistory = `${this.previousOperand} ${this.formatOpSymbol(op)}`;
                this.updateDisplay();
            }

            handleParenthesis(type) {
                if (type === 'open') {
                    this.expressionHistory += (this.expressionHistory ? ' ' : '') + '(';
                } else {
                    this.expressionHistory += ` ${this.currentInput})`;
                    try {
                        const sanitized = this.expressionHistory.replace(/×/g, '*').replace(/÷/g, '/').replace(/=/g, '');
                        const res = Function(`"use strict"; return (${sanitized})`)();
                        this.currentInput = String(this.formatResult(res));
                    } catch (e) {
                        this.currentInput = 'Error';
                    }
                }
                this.updateDisplay();
            }

            calculate(a, b, op) {
                switch(op) {
                    case '+': return a + b;
                    case '-': return a - b;
                    case '*': return a * b;
                    case '/': return b !== 0 ? a / b : 'Error';
                    case 'pow': return Math.pow(a, b);
                    case 'mod': return a % b;
                    default: return b;
                }
            }

            evaluateEquals() {
                if (this.operator === null || this.previousOperand === null) {
                    return;
                }

                const currentVal = parseFloat(this.currentInput);
                const result = this.calculate(this.previousOperand, currentVal, this.operator);

                const fullExpr = `${this.previousOperand} ${this.formatOpSymbol(this.operator)} ${currentVal}`;
                const formattedRes = this.formatResult(result);

                this.logToPaperTape(fullExpr, formattedRes);

                this.expressionHistory = `${fullExpr} =`;
                this.currentInput = String(formattedRes);
                this.previousOperand = null;
                this.operator = null;
                this.waitingForNextOperand = true;

                this.updateDisplay();
            }

                let val = parseFloat(this.currentInput);
                let res = 0;
                let exprLabel = `${fn}(${val})`;

                const toRad = (angle) => this.isRad ? angle : (angle * Math.PI) / 180;

                switch(fn) {
                    case 'sin': res = Math.sin(toRad(val)); break;
                    case 'cos': res = Math.cos(toRad(val)); break;
                    case 'tan': res = Math.tan(toRad(val)); break;
                    case 'ln': res = Math.log(val); break;
                    case 'log10': res = Math.log10(val); break;
                    case 'sqr': res = Math.pow(val, 2); break;
